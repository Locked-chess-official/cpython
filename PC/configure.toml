# PC/pyconfig.h configurable-macro description (probe-driven).
# Generated by PC/_gen_toml.py from the macro inventory of PC/pyconfig.h.
#
# Every detectable macro is resolved by compiling+running a tiny C probe
# against the active toolchain (configure.py injects the forced _CRT_*
# prelude so MSVC sees the same CRT name-space the real build does).
# The only literals left are build-policy switches, external-library
# dependencies, platform constants, and dead autoconf boilerplate.
#
# Modes:
#   [[analyse.bool]]     define MACRO <value> on success, /* #undef */ on fail
#   [[analyse.number]]   define MACRO to the probe stdout (integer)
#   [[analyse.string]]   define MACRO to the probe stdout (double-quoted)
#   [[analyse.literal]]  emit a fixed value (no probe)
#
# NOTE: `code` must be a TOML literal string ('''...''') so C escapes survive.

[analyse]

