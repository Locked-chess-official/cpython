[[analyse.bool]]
macro = "HAVE_PROTOTYPES"
comment = "Define to 1 if your compiler supports function prototypes."
header = ["stdio.h"]
code = '''
int add(int a, int b);
int main(void) { return add(1, 2) - 3; }
int add(int a, int b) { return a + b; }
'''

[[analyse.bool]]
macro = "HAVE_DYNAMIC_LOADING"
comment = "Define to 1 if you want support for dynamic loading of modules."
header = ["dlfcn.h"]
win_header = ["windows.h"]
code = '''
#ifdef _WIN32
int main(void) {
    HMODULE h = LoadLibraryA("kernel32.dll");
    if (h) FreeLibrary(h);
    return 0;
}
#else
int main(void) {
    void *h = dlopen(0, 0);
    if (h) dlclose(h);
    return 0;
}
#endif
'''
unix_libs = ["dl"]

# ---------------- Byte order ----------------
[[analyse.bool]]
macro = "DOUBLE_IS_LITTLE_ENDIAN_IEEE754"
comment = "Define to 1 if C doubles are 64-bit IEEE 754, least significant byte first."
header = ["string.h"]
code = '''
int main(void) {
    double d = 1.0;
    unsigned char b[8];
    memcpy(b, &d, 8);
    /* 1.0 = 0x3FF0000000000000; little-endian first byte is 0x00. */
    return (b[0] == 0x00) ? 0 : 1;
}
'''
run = true

